name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    # Windows + 3.12: igual ao PC da escola.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt
      - run: python -m pytest -q
