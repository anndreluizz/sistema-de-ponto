name: Testes

on:
  push:
    branches: [master]
  pull_request:

jobs:
  testes:
    # Windows + 3.12 e 3.14 (o PC da escola tem o 3.14).
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt
      - run: python -m pytest -q
